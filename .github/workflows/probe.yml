name: ESPN probe
# Prints ESPN's line fields for a few past dates (see tools/espn_probe.py).
on:
  workflow_dispatch:
    inputs:
      dates:
        description: "Space-separated YYYYMMDD dates"
        default: "20240115 20181115 20261030"
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tools/espn_probe.py ${{ inputs.dates }}
