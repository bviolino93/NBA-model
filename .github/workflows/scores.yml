name: Scores
# Prints ESPN final scores for a date (tools/scores.py), for grading picks.
on:
  workflow_dispatch:
    inputs:
      day:
        description: "YYYYMMDD"
        default: "20261110"
  push:
    branches: [claude/project-thread-nsu1m8]
    paths: [tools/scores.py, .github/workflows/scores.yml]
jobs:
  scores:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tools/scores.py ${{ inputs.day || '20261110' }}
