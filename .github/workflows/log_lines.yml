name: Log NBA lines

# Snapshots NBA game lines (and props once a day) from The Odds API and
# commits the CSVs under data/lines/. Needs repository secret ODDS_API_KEY.
#
# GitHub starts these 3 to 5 hours late in practice (Nov 2026: 15:13 and
# 22:41 UTC landed 19:25-21:28 and 01:50-03:42), so they are set early:
# 13:13 UTC usually lands early afternoon ET, 18:41 UTC late afternoon,
# before the first 7 PM ET tip; props are taken then. The closing line
# comes from close.yml. Games already tipped are skipped either way.

on:
  schedule:
    - cron: "13 13 * 10-12,1-6 *"
    - cron: "41 18 * 10-12,1-6 *"
  workflow_dispatch:
    inputs:
      props:
        description: "Include player props"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: log-lines
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas
      - name: Snapshot
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # Nightly props snapshot is on; repository variable LOG_PROPS=false turns it off
          # (~1,000 credits a month of the paid plan's 20,000).
          LOG_PROPS: ${{ vars.LOG_PROPS || 'true' }}
        run: |
          flags=""
          if [ "${{ inputs.props }}" = "true" ]; then flags="--props"; fi
          if [ "$LOG_PROPS" = "true" ] && [ "${{ github.event.schedule }}" = "41 18 * 10-12,1-6 *" ]; then flags="--props"; fi
          python log_lines.py --out-dir data/lines $flags
      - name: Commit
        run: |
          git config user.name "line-logger"
          git config user.email "line-logger@users.noreply.github.com"
          git add data/lines
          git diff --cached --quiet || git commit -m "Line snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            git pull -q --rebase origin main && git push && break
            sleep $((2 ** i))
          done
      - name: Early-line signals (DK/FD 1+ pts off Pinnacle)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/early_steam.py --alert early.md | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -f early.md ]; then
            n=$(gh issue list --state open --search "NBA picks alerts in:title" \
                  --json number -q '.[0].number')
            if [ -n "$n" ]; then
              { cat early.md; echo; echo "@${{ github.repository_owner }}"; } > early_body.md
              gh issue comment "$n" --body-file early_body.md
            fi
          fi
